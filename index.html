<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>皮克敏明信片收藏</title>
<style>
:root{
  --bg:#faf7f2; --fg:#2b2620; --card:#ffffff; --border:#e4ddd0;
  --accent:#e0a93a; --accent-fg:#fff; --muted:#8a8070; --danger:#c0564a;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1812; --fg:#f1ebe0; --card:#2a241c; --border:#45392a;
    --accent:#e0a93a; --accent-fg:#1c1812; --muted:#a79a82; --danger:#e08277;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1812; --fg:#f1ebe0; --card:#2a241c; --border:#45392a;
  --accent:#e0a93a; --accent-fg:#1c1812; --muted:#a79a82; --danger:#e08277;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;padding:16px;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));}
h1{font-size:19px;margin:4px 0 2px;}
p.sub{color:var(--muted);font-size:13px;margin:0 0 16px;}
.uploader{border:2px dashed var(--border);border-radius:14px;padding:18px;text-align:center;margin-bottom:18px;}
.uploader{position:relative;}
.pickLabel{display:inline-block;background:var(--accent);color:var(--accent-fg);padding:10px 20px;border-radius:999px;font-weight:600;font-size:14px;}
.uploader input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px;}
.imgwrap{position:relative;max-width:100%;touch-action:none;user-select:none;border-radius:8px;overflow:hidden;}
.imgwrap img{display:block;width:100%;height:auto;}
.cropbox{position:absolute;border:2px solid var(--accent);background:rgba(224,169,58,.15);cursor:move;}
.handle{position:absolute;right:-8px;bottom:-8px;width:18px;height:18px;background:var(--accent);border-radius:50%;cursor:nwse-resize;border:2px solid var(--card);}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.row input{flex:1;min-width:110px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);font-size:13px;}
.status{font-size:12px;color:var(--muted);margin-top:6px;}
.btns{display:flex;gap:8px;margin-top:10px;}
button{border:none;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;}
.save{background:var(--accent);color:var(--accent-fg);}
.discard{background:transparent;color:var(--danger);border:1px solid var(--danger);}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.toolbar input{flex:1 1 100%;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--fg);font-size:13px;}
.toolbar select{flex:1;min-width:140px;padding:9px 10px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--fg);font-size:13px;}
.folder{margin-bottom:12px;}
.folder-header{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:14px;font-weight:600;}
.folder-header .count{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:400;font-size:12px;}
.folder-header .arrow{transition:transform .15s;}
.folder.collapsed .arrow{transform:rotate(-90deg);}
.folder.collapsed .gallery{display:none;}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:10px;}
.gcard{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.gcard img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:pointer;}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:50;cursor:zoom-out;}
.lightbox.show{display:flex;}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px;cursor:default;}
.gcard .gi{padding:8px;font-size:12px;}
.gcard a{color:var(--accent);text-decoration:none;}
.gcard .rowbtns{display:flex;border-top:1px solid var(--border);}
.gcard .rowbtns button{flex:1;background:none;font-size:11px;padding:6px 4px;text-align:center;border-radius:0;}
.gcard .edit{color:var(--accent);border-right:1px solid var(--border);}
.gcard .del{color:var(--danger);}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:20px 0;}
h2{font-size:15px;margin:22px 0 10px;}
.actions{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.actions button, .fileBtn .label{padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.topbar .linkBtn{white-space:nowrap;padding:7px 12px;font-size:12px;}
.linkBtn{display:inline-block;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--accent);color:var(--accent);text-decoration:none;}
#clearBtn{background:transparent;border:1px solid var(--danger);color:var(--danger);}
#exportBtn{background:transparent;border:1px solid var(--accent);color:var(--accent);}
.fileBtn{position:relative;display:inline-block;}
.fileBtn .label{display:inline-block;border:1px solid var(--accent);color:var(--accent);}
.fileBtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;}
</style>
</head>
<body>
<div class="topbar">
  <h1>🌼 皮克敏明信片收藏</h1>
  <a id="loginBtn" class="linkBtn" href="https://claude.ai" target="_blank" rel="noopener">登入 claude.ai</a>
</div>
<p class="sub">上傳截圖 → 拖曳框選明信片範圍 → 自動辨識座標 → 存檔</p>
<div id="storageStatus" class="status" style="margin:-8px 0 14px;">儲存狀態確認中…</div>
<div id="migrateBox" class="card" style="display:none;font-size:13px;"></div>

<div class="uploader">
  <div class="pickLabel">選擇圖片（可多選）</div>
  <input id="file" type="file" accept="image/*" multiple>
</div>

<div class="actions">
  <button id="exportBtn" type="button">匯出備份</button>
  <div class="fileBtn">
    <div class="label">匯入備份</div>
    <input id="importFile" type="file" accept=".json,application/json">
  </div>
  <button id="clearBtn" type="button">清空資料庫</button>
</div>

<div id="pending"></div>

<h2>已保存的明信片</h2>
<div class="toolbar">
  <input id="searchBox" type="search" placeholder="🔍 搜尋名稱或國家">
  <select id="viewMode">
    <option value="folder">📁 依國家資料夾</option>
    <option value="all">🖼️ 全部顯示</option>
  </select>
  <select id="sortMode">
    <option value="date-desc">日期：新 → 舊</option>
    <option value="date-asc">日期：舊 → 新</option>
    <option value="name-asc">名稱：A → Z</option>
    <option value="name-desc">名稱：Z → A</option>
  </select>
</div>
<div id="gallery"></div>
<div id="emptyMsg" class="empty" style="display:none;">目前還沒有保存的明信片</div>

<div id="lightbox" class="lightbox"><img id="lightboxImg" alt=""></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
<script>
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open('pikminPostcards', 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore('postcards', {keyPath:'id', autoIncrement:true});
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
let dbInst;
async function getDB(){ if(!dbInst) dbInst = await openDB(); return dbInst; }
async function localAdd(record){
  const d = await getDB();
  return new Promise((resolve,reject)=>{
    const tx = d.transaction('postcards','readwrite');
    tx.objectStore('postcards').add(record);
    tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error);
  });
}
async function localGetAll(){
  const d = await getDB();
  return new Promise((resolve,reject)=>{
    const req = d.transaction('postcards','readonly').objectStore('postcards').getAll();
    req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
  });
}
async function localPut(record){
  const d = await getDB();
  return new Promise((resolve,reject)=>{
    const tx = d.transaction('postcards','readwrite');
    tx.objectStore('postcards').put(record);
    tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error);
  });
}
async function localDelete(id){
  const d = await getDB();
  return new Promise((resolve,reject)=>{
    const tx = d.transaction('postcards','readwrite');
    tx.objectStore('postcards').delete(id);
    tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error);
  });
}

let cloud = null;
const stripId = ({id, ...rest}) => rest;
async function dbAdd(record){ return cloud ? cloud.add(stripId(record)) : localAdd(record); }
async function dbGetAll(){
  if(!cloud) return localGetAll();
  const snap = await cloud.get();
  return snap.docs.map(d => ({...d.data(), id: d.id}));
}
async function dbPut(record){ return cloud ? cloud.doc(record.id).set(stripId(record)) : localPut(record); }
async function dbDelete(id){ return cloud ? cloud.doc(id).delete() : localDelete(id); }

function setStatus(html){ document.getElementById('storageStatus').innerHTML = html; }

async function initCloud(){
  try{
    const db = await claude.use('db');
    const user = await claude.use('user');
    if(db && user){
      const uid = await user.id();
      cloud = db.collection('data/users/' + uid + '/postcards');
      setStatus('☁️ 資料已存到雲端，換裝置登入後也能看到');
      document.getElementById('loginBtn').style.display = 'none';
      await loadGallery();
      checkMigration();
      return;
    }
  }catch(e){ console.error(e); }
  setStatus('💾 目前只存在此瀏覽器。登入 claude.ai 後重新開啟，即可改存雲端');
}

async function checkMigration(){
  try{
    const local = await localGetAll();
    if(!local.length) return;
    const box = document.getElementById('migrateBox');
    box.style.display = 'block';
    box.innerHTML = `此瀏覽器裡還有 ${local.length} 筆本機資料 <button id="migrateBtn" class="save" type="button">上傳到雲端</button>`;
    document.getElementById('migrateBtn').onclick = async (ev)=>{
      ev.target.disabled = true; ev.target.textContent = '上傳中…';
      try{
        for(const r of local){ await cloud.add(stripId(r)); await localDelete(r.id); }
        box.style.display = 'none';
        loadGallery();
      }catch(e){ console.error(e); ev.target.disabled = false; ev.target.textContent = '上傳到雲端'; alert('上傳失敗，請再試一次'); }
    };
  }catch(e){ console.error(e); }
}

async function loadGallery(){
  try{
    const docs = await dbGetAll();
    renderGallery(docs);
  }catch(e){ console.error(e); }
}

const openFolders = new Set();
let curDocs = [];
document.addEventListener('DOMContentLoaded', ()=>{
  for(const id of ['viewMode','sortMode'])
    document.getElementById(id).addEventListener('change', ()=> renderGallery(curDocs));
  document.getElementById('searchBox').addEventListener('input', ()=> renderGallery(curDocs));
});

function renderGallery(docs){
  const g = document.getElementById('gallery');
  const empty = document.getElementById('emptyMsg');
  g.innerHTML='';
  if(!docs.length){ empty.textContent='目前還沒有保存的明信片'; empty.style.display='block'; return; }
  empty.style.display='none';
  curDocs = docs;
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  if(q){
    docs = docs.filter(v => (v.name||'').toLowerCase().includes(q) || (countryFor(v.lat,v.lng)||'').toLowerCase().includes(q));
    if(!docs.length){ empty.textContent='找不到符合的明信片'; empty.style.display='block'; return; }
  }
  const sm = document.getElementById('sortMode').value;
  const byName = (a,b)=>{
    const x=a.name||'', y=b.name||'';
    if(!x && y) return 1;
    if(x && !y) return -1;
    return x.localeCompare(y,'zh-Hant');
  };
  docs.sort(
    sm==='date-asc' ? (a,b)=>(a.savedAt||0)-(b.savedAt||0) :
    sm==='name-asc' ? byName :
    sm==='name-desc' ? (a,b)=>{
      const x=a.name||'', y=b.name||'';
      if(!x && y) return 1;
      if(x && !y) return -1;
      return y.localeCompare(x,'zh-Hant');
    } :
    (a,b)=>(b.savedAt||0)-(a.savedAt||0)
  );

  if(document.getElementById('viewMode').value==='all'){
    const grid = document.createElement('div');
    grid.className = 'gallery';
    g.appendChild(grid);
    renderCards(grid, docs, docs);
    return;
  }

  const groups = {};
  for(const v of docs){
    const country = countryFor(v.lat, v.lng) || '未分類';
    (groups[country] = groups[country] || []).push(v);
  }
  const names = Object.keys(groups).sort((a,b)=> a==='未分類'?1 : b==='未分類'?-1 : a.localeCompare(b,'zh-Hant'));
  if(openFolders.size===0 && names.length) openFolders.add(names[0]);

  for(const country of names){
    const items = groups[country];
    const folder = document.createElement('div');
    folder.className = 'folder' + (openFolders.has(country) ? '' : ' collapsed');
    const header = document.createElement('div');
    header.className = 'folder-header';
    header.innerHTML = `<span>📁 ${escapeHtml(country)}</span><span class="count">${items.length} 筆<span class="arrow">▾</span></span>`;
    header.onclick = ()=>{ openFolders.has(country) ? openFolders.delete(country) : openFolders.add(country); renderGallery(curDocs); };
    const grid = document.createElement('div');
    grid.className = 'gallery';
    folder.appendChild(header);
    folder.appendChild(grid);
    g.appendChild(folder);
    renderCards(grid, items, docs);
  }
}

function renderCards(grid, items, allDocs){
  for(const v of items){
    const el = document.createElement('div');
    el.className='gcard';
    const mapsUrl = (v.lat!=null && v.lng!=null) ? `https://www.google.com/maps?q=${v.lat},${v.lng}` : '#';
    el.innerHTML = `<img src="${v.img}" alt="">
      <div class="gi">${v.name?`<div>${escapeHtml(v.name)}</div>`:''}
      ${v.lat!=null?`<a href="${mapsUrl}" target="_blank">${v.lat.toFixed(6)}, ${v.lng.toFixed(6)}</a>`:'<span style="color:var(--muted)">無座標</span>'}</div>
      <div class="rowbtns"><button class="edit">編輯</button><button class="del">刪除</button></div>`;
    el.querySelector('img').onclick = ()=>{
      document.getElementById('lightboxImg').src = v.img;
      document.getElementById('lightbox').classList.add('show');
    };
    el.querySelector('.del').onclick = async ()=>{ try{ await dbDelete(v.id); loadGallery(); }catch(e){console.error(e);} };
    el.querySelector('.edit').onclick = async ()=>{
      const name = prompt('地點名稱', v.name||'');
      if(name===null) return;
      const latStr = prompt('緯度', v.lat!=null?v.lat:'');
      if(latStr===null) return;
      const lngStr = prompt('經度', v.lng!=null?v.lng:'');
      if(lngStr===null) return;
      const lat = parseFloat(latStr), lng = parseFloat(lngStr);
      try{
        await dbPut({...v, name:name.trim(), lat:isNaN(lat)?null:lat, lng:isNaN(lng)?null:lng});
        loadGallery();
      }catch(e){ console.error(e); alert('更新失敗'); }
    };
    grid.appendChild(el);
  }
}

function countryFor(lat,lng){
  if(lat==null||lng==null||isNaN(lat)||isNaN(lng)) return null;
  let best=null, bestArea=Infinity;
  for(const code in CBB){
    const [name,[minLon,minLat,maxLon,maxLat]] = CBB[code];
    if(lng>=minLon && lng<=maxLon && lat>=minLat && lat<=maxLat){
      const area=(maxLon-minLon)*(maxLat-minLat);
      if(area<bestArea){ bestArea=area; best=name; }
    }
  }
  return best;
}

document.getElementById('file').addEventListener('change', (e)=>{
  for(const f of e.target.files) addPending(f);
  e.target.value='';
});

function addPending(file){
  const reader = new FileReader();
  reader.onload = ()=> buildCard(reader.result);
  reader.readAsDataURL(file);
}

function buildCard(dataUrl){
  const card = document.createElement('div');
  card.className='card';
  card.innerHTML = `
    <div class="imgwrap">
      <img src="${dataUrl}">
      <div class="cropbox"><div class="handle"></div></div>
    </div>
    <div class="status">辨識座標中…</div>
    <div class="row">
      <input class="nameInput" placeholder="地點名稱（選填）">
      <input class="latInput" placeholder="緯度">
      <input class="lngInput" placeholder="經度">
    </div>
    <div class="btns">
      <button class="save">保存明信片</button>
      <button class="discard">捨棄</button>
    </div>`;
  document.getElementById('pending').appendChild(card);

  const img = card.querySelector('.imgwrap img');
  const wrap = card.querySelector('.imgwrap');
  const box = card.querySelector('.cropbox');
  const handle = card.querySelector('.handle');

  img.onload = ()=>{
    const w = wrap.clientWidth, h = img.clientHeight;
    const bw = w*0.5, bh = bw;
    box.style.left = (w*0.45)+'px'; box.style.top = (h*0.1)+'px';
    box.style.width = bw+'px'; box.style.height = bh+'px';
    runOCR(dataUrl, card);
  };

  let drag=null;
  box.addEventListener('pointerdown', (ev)=>{
    if(ev.target===handle) return;
    drag={type:'move', sx:ev.clientX, sy:ev.clientY, l:box.offsetLeft, t:box.offsetTop};
    box.setPointerCapture(ev.pointerId);
  });
  handle.addEventListener('pointerdown', (ev)=>{
    ev.stopPropagation();
    drag={type:'resize', sx:ev.clientX, sy:ev.clientY, w:box.offsetWidth, h:box.offsetHeight};
    handle.setPointerCapture(ev.pointerId);
  });
  wrap.addEventListener('pointermove', (ev)=>{
    if(!drag) return;
    const dx=ev.clientX-drag.sx, dy=ev.clientY-drag.sy;
    if(drag.type==='move'){
      let nl=drag.l+dx, nt=drag.t+dy;
      nl=Math.max(0,Math.min(nl, wrap.clientWidth-box.offsetWidth));
      nt=Math.max(0,Math.min(nt, wrap.clientHeight-box.offsetHeight));
      box.style.left=nl+'px'; box.style.top=nt+'px';
    } else {
      let nw=Math.max(30,drag.w+dx), nh=Math.max(30,drag.h+dy);
      nw=Math.min(nw, wrap.clientWidth-box.offsetLeft);
      nh=Math.min(nh, wrap.clientHeight-box.offsetTop);
      box.style.width=nw+'px'; box.style.height=nh+'px';
    }
  });
  window.addEventListener('pointerup', ()=> drag=null);

  card.querySelector('.discard').onclick = ()=> card.remove();
  card.querySelector('.save').onclick = ()=> saveCard(card, img, box);
}

async function runOCR(dataUrl, card){
  const statusEl = card.querySelector('.status');
  try{
    const { data:{ text } } = await Tesseract.recognize(dataUrl, 'eng');
    const m = text.match(/(-?\d{1,3}\.\d{3,8})\s*,\s*(-?\d{1,3}\.\d{3,8})/);
    if(m){
      card.querySelector('.latInput').value = m[1];
      card.querySelector('.lngInput').value = m[2];
      const c = countryFor(parseFloat(m[1]), parseFloat(m[2]));
      statusEl.textContent = c ? `已自動辨識座標，判斷為：${c}（可手動修正）` : '已自動辨識座標，可手動修正';
    } else {
      statusEl.textContent = '未能自動辨識座標，請手動輸入';
    }
  }catch(e){
    statusEl.textContent = '辨識失敗，請手動輸入座標';
  }
}

async function saveCard(card, img, box){
  const scale = img.naturalWidth / img.clientWidth;
  const sx = box.offsetLeft*scale, sy = box.offsetTop*scale;
  const sw = box.offsetWidth*scale, sh = box.offsetHeight*scale;
  const maxOut = 480;
  const outW = Math.min(maxOut, sw), outH = outW*(sh/sw);
  const canvas = document.createElement('canvas');
  canvas.width=outW; canvas.height=outH;
  canvas.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, outW, outH);
  let dataUrl = canvas.toDataURL('image/jpeg', 0.75);
  if(dataUrl.length > 230000) dataUrl = canvas.toDataURL('image/jpeg', 0.5);

  const btn = card.querySelector('.save'); btn.disabled=true; btn.textContent='保存中…';
  try{
    const lat = parseFloat(card.querySelector('.latInput').value);
    const lng = parseFloat(card.querySelector('.lngInput').value);
    const name = card.querySelector('.nameInput').value.trim();
    await dbAdd({ img: dataUrl, lat: isNaN(lat)?null:lat, lng: isNaN(lng)?null:lng, name, savedAt: Date.now() });
    card.remove();
    loadGallery();
  }catch(e){
    console.error(e); btn.disabled=false; btn.textContent='保存明信片'; alert('保存失敗，瀏覽器儲存空間可能不足');
  }
}

document.getElementById('exportBtn').onclick = async ()=>{
  try{
    const docs = await dbGetAll();
    if(!docs.length){ alert('目前沒有資料可以匯出'); return; }
    const blob = new Blob([JSON.stringify(docs)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'pikmin-postcards-backup.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 1000);
  }catch(e){
    console.error(e); alert('匯出失敗：' + (e?.message || e));
  }
};

document.getElementById('importFile').addEventListener('change', async (e)=>{
  const f = e.target.files[0];
  if(!f) return;
  try{
    const text = await f.text();
    const arr = JSON.parse(text);
    if(!Array.isArray(arr)) throw new Error('format');
    let count = 0;
    for(const rec of arr){
      if(!rec || !rec.img) continue;
      const { id, ...rest } = rec;
      await dbAdd(rest);
      count++;
    }
    alert(`已匯入 ${count} 筆明信片`);
    loadGallery();
  }catch(err){
    console.error(err); alert('匯入失敗，請確認檔案格式正確');
  }
  e.target.value='';
});

document.getElementById('clearBtn').onclick = async ()=>{
  try{
    const docs = await dbGetAll();
    if(!docs.length){ alert('資料庫目前是空的'); return; }
    const where = cloud ? '雲端' : '此瀏覽器';
    if(!confirm(`確定要清空${where}的全部 ${docs.length} 筆明信片嗎？\n此動作無法復原，建議先按「匯出備份」。`)) return;
    if(!confirm('再確認一次：真的要全部刪除嗎？')) return;
    const btn = document.getElementById('clearBtn'); btn.disabled = true; btn.textContent = '清空中…';
    for(const d of docs) await dbDelete(d.id);
    btn.disabled = false; btn.textContent = '清空資料庫';
    loadGallery();
  }catch(e){
    console.error(e); alert('清空失敗：' + (e?.message || e));
    const btn = document.getElementById('clearBtn'); btn.disabled = false; btn.textContent = '清空資料庫';
  }
};

document.getElementById('lightbox').onclick = ()=> document.getElementById('lightbox').classList.remove('show');

loadGallery();
initCloud();
</script>
